# Installers for Windows, macOS (Apple Silicon + Intel) and Linux.
# - every push to main (or "Run workflow"): builds every installer, each one also an artifact of the run (Actions tab)
# - if "version" in apps/Nexora/src-tauri/tauri.conf.json has no tag "v<version>" yet: the tag and a published GitHub
#   Release with every installer attached are created; already released → build only (bump the version to release)
# Not signed: Windows SmartScreen warns on first run; macOS needs right click → Open (or `xattr -cr Nexora.app`).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# runs queue instead of overlapping, so two pushes of a new version can't both create its release
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          v=$(jq -r .version apps/Nexora/src-tauri/tauri.conf.json)
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then r=false; else r=true; fi
          echo "v$v release=$r"
          echo "release=$r" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      BUNDLE: apps/Nexora/src-tauri/target/${{ matrix.target }}/release/bundle
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get remove -y 'libunwind-*' || true
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/Nexora/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install
        shell: bash
        run: |
          cd server && bun install --frozen-lockfile
          cd ../apps/Nexora && bun install --frozen-lockfile

      # beforeBuildCommand (tauri.release.conf.json) builds the app and compiles the server for this target into
      # src-tauri/binaries, which Tauri ships beside the app
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/Nexora
          tauriScript: bun run tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
          # empty tagName = build only, no release
          tagName: ${{ needs.version.outputs.release == 'true' && 'v__VERSION__' || '' }}
          releaseName: Nexora __VERSION__
          releaseBody: Tải bộ cài cho máy của bạn ở mục Assets bên dưới.
          releaseDraft: false

      # one artifact per installer, downloaded as the file itself instead of a zip (archive: false takes a single file,
      # named after it)
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with: { path: "${{ env.BUNDLE }}/msi/*.msi", archive: false, if-no-files-found: error }
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with: { path: "${{ env.BUNDLE }}/nsis/*.exe", archive: false, if-no-files-found: error }
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with: { path: "${{ env.BUNDLE }}/dmg/*.dmg", archive: false, if-no-files-found: error }
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with: { path: "${{ env.BUNDLE }}/deb/*.deb", archive: false, if-no-files-found: error }
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with: { path: "${{ env.BUNDLE }}/rpm/*.rpm", archive: false, if-no-files-found: error }
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with: { path: "${{ env.BUNDLE }}/appimage/*.AppImage", archive: false, if-no-files-found: error }
