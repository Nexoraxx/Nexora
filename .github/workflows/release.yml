# Installers for Windows, macOS (Apple Silicon + Intel) and Linux.
# - push a tag "v<version>" (e.g. `git tag v0.2.0 && git push origin v0.2.0`): builds every installer with that version
#   (overrides "version" in tauri.conf.json) and publishes a GitHub Release for the tag with every installer attached
# - push to main / "Run workflow": build only, each installer is an artifact of the run (Actions tab)
# MSI needs a numeric version: v1.2.3 or v1.2.3-4, not v1.2.3-alpha.
# Not signed: Windows SmartScreen warns on first run; macOS needs right click → Open (or `xattr -cr Nexora.app`).
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      BUNDLE: apps/Nexora/src-tauri/target/${{ matrix.target }}/release/bundle
    steps:
      - uses: actions/checkout@v7

      - name: Version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          f=apps/Nexora/src-tauri/tauri.conf.json
          jq --arg v "${GITHUB_REF_NAME#v}" '.version = $v' $f > tmp.json && mv tmp.json $f

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get remove -y 'libunwind-*' || true
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/Nexora/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install
        shell: bash
        run: |
          cd server && bun install --frozen-lockfile
          cd ../apps/Nexora && bun install --frozen-lockfile

      # beforeBuildCommand (tauri.release.conf.json) builds the app and compiles the server for this target into
      # src-tauri/binaries, which Tauri ships beside the app
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/Nexora
          tauriScript: bun run tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
          # empty tagName = build only, no release
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Nexora __VERSION__
          releaseBody: Tải bộ cài cho máy của bạn ở mục Assets bên dưới.
          releaseDraft: false

      # one artifact per installer, downloaded as the file itself instead of a zip (archive: false takes a single file,
      # named after it)
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with: { path: "${{ env.BUNDLE }}/msi/*.msi", archive: false, if-no-files-found: error }
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with: { path: "${{ env.BUNDLE }}/nsis/*.exe", archive: false, if-no-files-found: error }
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with: { path: "${{ env.BUNDLE }}/dmg/*.dmg", archive: false, if-no-files-found: error }
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with: { path: "${{ env.BUNDLE }}/deb/*.deb", archive: false, if-no-files-found: error }
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with: { path: "${{ env.BUNDLE }}/rpm/*.rpm", archive: false, if-no-files-found: error }
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with: { path: "${{ env.BUNDLE }}/appimage/*.AppImage", archive: false, if-no-files-found: error }
